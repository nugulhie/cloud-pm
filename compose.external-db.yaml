# Standalone deployment for an existing PostgreSQL database.
x-environment: &environment
  NODE_ENV: production
  APP_URL: https://${DOMAIN:?Set DOMAIN}
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
  TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:?Set TOKEN_ENCRYPTION_KEY}
  GITHUB_ORG: ${GITHUB_ORG:?Set GITHUB_ORG}
  GITHUB_TOKEN: ${GITHUB_TOKEN:-}
  GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
  GITHUB_APP_ID: ${GITHUB_APP_ID:-}
  GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID:-}
  GITHUB_APP_INSTALLATION_ID: ${GITHUB_APP_INSTALLATION_ID:-}
  GITHUB_APP_PRIVATE_KEY_BASE64: ${GITHUB_APP_PRIVATE_KEY_BASE64:-}
  GITHUB_APP_WORKSPACE_ID: ${GITHUB_APP_WORKSPACE_ID:-main}
  GITHUB_APP_WEBHOOK_SECRET: ${GITHUB_APP_WEBHOOK_SECRET:-}
  GITHUB_SYNC_SINCE: ${GITHUB_SYNC_SINCE:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
services:
  app:
    build:
      context: .
      target: web
    environment:
      <<: *environment
      NODE_OPTIONS: --max-old-space-size=256
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
    mem_limit: 320m
    restart: unless-stopped
    logging: *logging
  worker:
    build:
      context: .
      target: worker
    environment:
      <<: *environment
      NODE_OPTIONS: --max-old-space-size=128
    mem_limit: 192m
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging
  proxy:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - proxy_config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging
volumes:
  certificates:
  proxy_config:

# Existing ALB terminates TLS. Keep other nginx virtual hosts intact.
server {
    listen 80 default_server;
    server_name cloud-pm.soldoc.co.kr;
    client_max_body_size 24m;
    gzip on;
    gzip_types application/json application/javascript text/css;
    gzip_min_length 1024;
    gzip_vary on;

    location = /health {
        proxy_pass http://127.0.0.1:3000/api/health;
        proxy_set_header Host cloud-pm.soldoc.co.kr;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
server {
    listen 80;
    server_name peers.soldoc.co.kr;
    return 308 https://cloud-pm.soldoc.co.kr$request_uri;
}

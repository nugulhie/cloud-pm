purpose:
  stands_in_for: GitHub App 사용자 OAuth 토큰 교환·본인·조직 멤버십과 이슈 담당자 REST 변경.
  unblocks: 실제 계정·이슈를 수정하지 않고 PKCE 교환과 태스크 연결·담당자 재배정을 HTTP로 검증.
assumptions:
  - id: oauth-pkce-and-membership
    status: supported
    claim: 테스트하는 OAuth 흐름에서 PKCE·사용자 ID·조직 멤버십을 실제 HTTP로 확인하고 인증 세션을 발급한다.
    reason: 공식 GitHub 계약에서 client secret·code verifier·사용자 조회와 활성 조직 멤버십이 필요하며 로컬 모의는 이 경로만 모델링한다.
    verification: 로컬 HTTP 통합 검증과 브라우저 OAuth 콜백·세션 검증 통과. 실제 GitHub 사용자 동의 및 조직 App의 Members 권한은 별도 실서비스 확인 대상이다.
    source: src/users/github-oauth.ts; https://docs.github.com/en/apps/creating-github-apps/authenticating-with-a-github-app/generating-a-user-access-token-for-a-github-app
    updated_at: "2026-11-05"
  - id: issue-assignee-replacement
    status: supported
    claim: 테스트하는 이슈 변경 흐름에서 원본 시각 검사·배정 가능 검사·PATCH 후 실제 응답 확인을 수행한다.
    reason: 담당자 추가 전용 API는 기존 담당자를 대체하지 않으므로 공식 Update an issue의 assignees를 사용한다. 응답 유실은 성공 여부를 보장하지 않는다.
    verification: HTTP 통합 검증에서 모의 요청 19건·실제 외부 전달 0건으로 담당자 무시·변경 후 응답 유실을 검증했다. 브라우저에서 원본 담당자 변경과 내부 태스크 반영도 검증했다. 실제 조직 이슈 수정은 수행하지 않았다.
    source: src/core/issue-assignees.ts; src/github/client.ts; https://docs.github.com/en/rest/issues/issues#update-an-issue
    updated_at: "2026-11-05"
fingerprints:
  - id: github-planning-20261105
    date: "2026-11-05"
    commit: null
    cli: Postman CLI 1.80.0; Node.js 24; 소유자 모의 검색은 CLI 미로그인으로 생략하고 공식 계약 기반 자체 로컬 모의를 사용한다.

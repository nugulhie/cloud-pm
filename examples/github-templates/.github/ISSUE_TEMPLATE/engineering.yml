name: 기술·운영 작업
description: 리팩터링·운영·기술 부채 작업의 목적과 검증 방법을 기록합니다.
title: "[기술] "
body:
  - type: markdown
    attributes:
      value: |
        사용자 화면이 없는 작업도 목적·범위·검증 결과를 남기세요.
        연결 정보를 모르면 비워 두세요. 태스크로 관리할 필요가 있는지는 별도로 결정합니다.
  - type: textarea
    id: cloud-pm-link
    attributes:
      label: Cloud PM 연결
      description: 연결 정보를 모르면 비워 두세요. 이름 대신 등록된 ID를 사용하세요.
      render: yaml
      placeholder: |
        version: 1
        workspace: product-team
        project: customer-platform
        feature: null
        task: null
    validations:
      required: false
  - type: textarea
    id: reason
    attributes:
      label: 필요성과 기대 효과
      placeholder: 어떤 문제·운영 비용·위험을 줄이기 위한 작업인가요?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 작업 범위
      placeholder: 변경 대상과 이번 작업에서 제외할 내용을 작성하세요.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: 검증 방법
      placeholder: 작업의 성공 여부를 어떤 테스트·관측 결과로 확인하나요?
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: 의존성·위험·복구 방법
      description: 선행 작업, 운영 영향, 실패 시 복구 방법을 추가하세요.
    validations:
      required: false

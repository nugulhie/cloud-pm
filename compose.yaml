services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: cloud_pm
      POSTGRES_USER: cloudpm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cloudpm-local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - cloud_pm_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudpm -d cloud_pm"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  cloud_pm_data:
